services:
  # ===============================
  # BACKEND SERVICE
  # ===============================
  - type: web
    name: udubs-backend
    rootDir: backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: |
      npm install
      npx prisma generate
    startCommand: |
      npm start
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RENPY_EVENT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://udubs-frontend.onrender.com
      - key: BACKEND_URL
        value: https://udubs-backend.onrender.com
      - key: ANTI_VPN_CHECK
        value: false
      - key: UPLOAD_DIR
        value: uploads

  # ===============================
  # FRONTEND SERVICE
  # ===============================
  - type: web
    name: udubs-frontend
    rootDir: frontend
    env: node
    region: frankfurt
    plan: free
    buildCommand: |
      npm install
      npm run build
    startCommand: |
      npm run preview -- --host 0.0.0.0 --port $PORT
    autoDeploy: true

    envVars:
      - key: VITE_BACKEND_URL
        value: https://udubs-backend.onrender.com
